name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: make test
      - name: Test simulation report publisher
        run: |
          node --test .github/scripts/*.test.cjs
          python3 -B .github/scripts/test_prepare_simulation.py

  simulation-workloads:
    name: Discover simulation workloads
    runs-on: ubuntu-latest
    outputs:
      workloads: ${{ steps.workloads.outputs.workloads }}
      integrations: ${{ steps.workloads.outputs.integrations }}
      batches: ${{ steps.workloads.outputs.batches }}
      main-sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: main
        run: |
          git fetch --depth=1 origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - id: workloads
        run: |
          workloads=$(node .github/scripts/simulation-workloads.cjs)
          {
            echo "workloads=$workloads"
            echo "integrations=$(jq -c '[.[] | select(.name != "direct")]' <<< "$workloads")"
            echo "batches=$(node .github/scripts/simulation-workloads.cjs --batches)"
          } >> "$GITHUB_OUTPUT"

  simulation-build:
    name: Build simulation (${{ matrix.workload.name }}, ${{ matrix.client }})
    needs: [simulation-workloads]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.simulation-workloads.outputs.workloads) }}
        client: [pr, main]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/.simulation-harness/${{ matrix.workload.name != 'direct' && matrix.workload.name || '' }}
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.workload.goVersionFile }}
          # The faster test job must not claim the integration build's cache key.
          cache-dependency-path: |
            go.sum
            pkg/internal/simulation/**/go.sum
            pkg/internal/simulation/**/*-version.txt
            pkg/internal/simulation/**/build-*.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.client == 'main'
        with:
          ref: ${{ needs.simulation-workloads.outputs.main-sha }}
          path: .simulation-main-client
          persist-credentials: false
      - name: Stage common harness
        working-directory: ${{ github.workspace }}
        env:
          CLIENT_VARIANT: ${{ matrix.client }}
          MAIN_SHA: ${{ needs.simulation-workloads.outputs.main-sha }}
        run: |
          client_directory="$GITHUB_WORKSPACE"
          if [ "$CLIENT_VARIANT" = main ]; then
            client_directory="$GITHUB_WORKSPACE/.simulation-main-client"
          fi
          python3 .github/scripts/prepare-simulation.py "$client_directory" "$GITHUB_WORKSPACE/.simulation-harness"
          echo "WARPSTREAM_CLIENT_DIR=$client_directory" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/simulation-build/provenance"
          git -C "$client_directory" rev-parse HEAD | tee "$RUNNER_TEMP/simulation-build/provenance/client-sha.txt"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD | tee "$RUNNER_TEMP/simulation-build/provenance/harness-sha.txt"
          printf '%s\n' "$MAIN_SHA" | tee "$RUNNER_TEMP/simulation-build/provenance/main-sha.txt"
      - name: Build integration workload
        if: matrix.workload.name != 'direct'
        run: |
          for build in build-*.sh; do
            if [ -f "$build" ]; then
              bash "$build" "$RUNNER_TEMP/simulation-build/workload"
            fi
          done
      - name: Test real Prometheus sender retries
        if: matrix.workload.name == 'mimir' && matrix.client == 'pr'
        env:
          PROMETHEUS_BINARY: ${{ runner.temp }}/simulation-build/workload/prometheus
        run: go test -mod=mod -race -p 2 -count=1 -run '^TestPrometheus_RetryRemoteWrite$' .
      - name: Build simulation harness
        run: |
          mkdir -p "$RUNNER_TEMP/simulation-build"
          go build -mod=mod -p 2 -o "$RUNNER_TEMP/simulation-build/harness" .
      # Tar preserves executable permissions across artifact upload/download.
      - name: Package simulation executables
        run: tar -czf "$RUNNER_TEMP/simulation-build.tar.gz" -C "$RUNNER_TEMP/simulation-build" .
      - name: Upload simulation executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-simulation-${{ matrix.workload.name }}-${{ matrix.client }}
          path: ${{ runner.temp }}/simulation-build.tar.gz
          compression-level: 0
          if-no-files-found: error

  simulation-harness-test:
    name: Test integration harness (${{ matrix.workload.name }})
    needs: [simulation-workloads]
    if: needs.simulation-workloads.outputs.integrations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.simulation-workloads.outputs.integrations) }}
    defaults:
      run:
        working-directory: ${{ matrix.workload.directory }}
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.workload.goVersionFile }}
          cache-dependency-path: |
            go.sum
            pkg/internal/simulation/**/go.sum
            pkg/internal/simulation/**/*-version.txt
      - name: Test integration harness
        run: go test -mod=mod -race -p 2 ./...

  simulation:
    name: Simulation (${{ matrix.workload.name }}, ${{ matrix.client }}, batch ${{ matrix.workload.batch }}, run ${{ matrix.run }})
    needs: [simulation-workloads, simulation-build]
    # A failed workload build must not suppress suites with usable artifacts.
    if: ${{ !cancelled() && needs.simulation-workloads.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.simulation-workloads.outputs.batches) }}
        run: [1, 2, 3]
        client: [pr, main]
    defaults:
      run:
        working-directory: ${{ matrix.workload.directory }}
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download simulation executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-simulation-${{ matrix.workload.name }}-${{ matrix.client }}
          path: ${{ runner.temp }}
      - name: Extract simulation executables
        run: |
          mkdir -p "$RUNNER_TEMP/simulation-build"
          tar -xzf "$RUNNER_TEMP/simulation-build.tar.gz" -C "$RUNNER_TEMP/simulation-build"
      # Wall-clock outcomes vary between runs; report expectations without gating CI.
      - name: Run simulation
        env:
          SIMULATION_TIMEOUT: ${{ matrix.workload.timeout }}
          SIMULATION_BATCH: ${{ matrix.workload.batch }}
          SIMULATION_BATCHES: ${{ matrix.workload.batches }}
          SIMULATION_BINARY: ${{ runner.temp }}/simulation-build/workload/${{ matrix.workload.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/simulation-report"
          cp "$RUNNER_TEMP/simulation-build/provenance/"*.txt "$RUNNER_TEMP/simulation-report/"
          "$RUNNER_TEMP/simulation-build/harness" -timeout "$SIMULATION_TIMEOUT" -check=false \
            -batch "$SIMULATION_BATCH" -batches "$SIMULATION_BATCHES" \
            -report-filepath "$RUNNER_TEMP/simulation-report/report.md" \
            -json-report-filepath "$RUNNER_TEMP/simulation-report/report.json"
      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-${{ matrix.workload.name }}-${{ matrix.client }}-${{ matrix.run }}-batch-${{ matrix.workload.batch }}
          path: ${{ runner.temp }}/simulation-report/
          if-no-files-found: ignore
      - name: Publish simulation report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/simulation-report/report.md" ]; then
            cat "$RUNNER_TEMP/simulation-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  simulation-report:
    name: Simulation report
    needs: [simulation]
    if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simulation-*
          path: ${{ runner.temp }}/simulation-reports
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/simulation-report.cjs "$RUNNER_TEMP/simulation-reports" --publish

  vendor:
    name: Check go.mod, go.sum and vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go mod tidy and go mod vendor
        run: |
          go mod tidy
          go mod vendor
      - name: Check go.mod, go.sum and vendor/ are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod, go.sum or vendor/ are out of date. Run 'go mod tidy && go mod vendor' and commit the result." >&2
            git status --porcelain
            git diff
            exit 1
          fi
